<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Neil Bardal Tournament</title>

<link rel="stylesheet" href="bracket.css">
</head>

<body>

<div class="container">

<h1>Neil Bardal Tournament</h1>

<p class="subtitle">
32 Slot Handicap Tournament • Race to 400
</p>

<div id="progressContainer">
<div id="progressText">
Tournament Progress: 0 / 31 Matches Complete
</div>

<div class="progressOuter">
<div id="progressFill"></div>
</div>
</div>

<div class="bracket-wrapper">

<div class="bracket">

<div class="round">
    <h2>Round 1</h2>
    <div class="round-date">January 3, 2027</div>
    <div id="round1"></div>
</div>

<div class="round">
    <h2>Round 2</h2>
    <div class="round-date">February 7, 2027</div>
    <div id="round2"></div>
</div>

<div class="round">
    <h2>Quarter Finals</h2>
    <div class="round-date">February 27, 2027</div>
    <div id="quarters"></div>
</div>

<div class="round">
    <h2>Semi Finals</h2>
    <div class="round-date">T.B.D.</div>
    <div id="semis"></div>
</div>

<div class="round" id="finals">
    <h2>Final</h2>
    <div class="round-date">T.B.D.</div>
    <div id="final"></div>

<div class="champion-section">

<h2>Champion</h2>

<div class="champion-card">
🏆
<div id="championName">TBD</div>
</div>

</div>

</div>

</div>

</div>

</div>

</div>

</div>

<script src="players.js"></script>
<script src="bracket.js"></script>

</body>
</html>
